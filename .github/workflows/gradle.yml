name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Minecraft 26.x + Fabric Loom brauchen Java 25 (nicht 17!)
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Installiert Gradle selbst -> kein ./gradlew im Repo nötig
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Repo-Struktur anzeigen
        run: |
          echo "== Dateien im Repo =="
          find . -path ./.git -prune -o -type f -print | sort

      - name: Build
        run: gradle build

      # Schlägt fehl, wenn die JAR leer ist (z. B. weil src/ im Repo fehlt)
      - name: Prüfen, ob die JAR wirklich Inhalt hat
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Prüfe $JAR"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q 'de/hugosmpmoney/HugoSmpMoneyClient.class' || { echo "FEHLER: Klasse fehlt -> src/main/java/de/hugosmpmoney/HugoSmpMoneyClient.java liegt nicht im Hauptordner des Repos"; exit 1; }
          unzip -l "$JAR" | grep -q 'fabric.mod.json' || { echo "FEHLER: fabric.mod.json fehlt -> src/main/resources/fabric.mod.json liegt nicht im Hauptordner des Repos"; exit 1; }

      - name: Mod-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: hugosmp-money-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
